# ─────────────────────────────────────────────────────────────
# Human-readable labels for exercise metadata (see NAMING_CONVENTION.md
# in the source Excercises folder for the underlying skill/grammar/level
# vocabulary). Used to render filter pills and card tags in both languages.
# Add a new key here whenever a new skill/grammar/theme value is used in
# _data/exercise_catalog.yml.
# ─────────────────────────────────────────────────────────────

skills:
  memorama: { es: "Memorama", en: "Memory match" }
  tabu: { es: "Tabú", en: "Taboo" }
  cloze: { es: "Historia para completar", en: "Story fill-in" }
  drill: { es: "Repaso guiado", en: "Guided drill" }
  flashcards: { es: "Tarjetas de memoria", en: "Flashcards" }
  guesswho: { es: "¿Quién es quién?", en: "Guess Who?" }
  board: { es: "Juego de tablero", en: "Board game" }
  escenas: { es: "Escenas", en: "Scenes" }
  rueda: { es: "Rueda de letras", en: "Letter wheel" }

grammar:
  presente: { es: "Presente", en: "Present tense" }
  tiempos_simples: { es: "Tiempos simples", en: "Simple tenses" }
  preterito_imperfecto: { es: "Pretérito e imperfecto", en: "Preterite and imperfect" }
  mandatos_futuro: { es: "Mandatos y futuro", en: "Commands and future tense" }
  vocab: { es: "Vocabulario", en: "Vocabulary" }
  repaso_general: { es: "Repaso general", en: "General review" }

levels:
  a1: { es: "A1 · Principiante", en: "A1 · Beginner" }
  a2: { es: "A2 · Elemental", en: "A2 · Elementary" }
  b1: { es: "B1 · Intermedio", en: "B1 · Intermediate" }

themes:
  general: { es: "General", en: "General" }
  deportes: { es: "Deportes", en: "Sports" }
  viajes: { es: "Viajes", en: "Travel" }
  bienes_raices: { es: "Bienes raíces", en: "Real estate" }
  ciudad: { es: "Ciudad", en: "City" }

# target_langs — labels for the language being PRACTICED, used by the
# language filter pill group on /ejercicios/.
target_langs:
  es: { es: "Español", en: "Spanish" }
  it: { es: "Italiano", en: "Italian" }
